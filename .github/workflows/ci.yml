name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (ESP32-C2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.4.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32c2
          path: firmware
          command: idf.py build && idf.py size && idf.py merge-bin

      - name: Firmware size
        if: always()
        run: |
          if [ -f firmware/build/agentdock.bin ]; then
            echo "### Firmware size" >> "$GITHUB_STEP_SUMMARY"
            ls -lh firmware/build/agentdock.bin firmware/build/merged-binary.bin 2>/dev/null \
              | awk '{print "- `" $9 "`: " $5}' >> "$GITHUB_STEP_SUMMARY"
            ls -lh firmware/build/agentdock.bin
          fi

      - name: Upload firmware artifacts
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-firmware-${{ github.sha }}
          path: |
            firmware/build/agentdock.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/merged-binary.bin
            firmware/build/flash_args
          if-no-files-found: error
          retention-days: 30

  plugin:
    name: Plugin (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pi-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pi-plugin/package-lock.json

      # --ignore-scripts avoids building native BLE bindings on the runner;
      # the type definitions needed for typechecking are still installed.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
