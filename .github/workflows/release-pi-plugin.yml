name: Release pi-plugin

# Push a tag like pi-plugin-v0.1.1 and this publishes that exact version to npm.
# The tag is the source of truth: the workflow sets package.json's version from
# it, so no local `npm version` step is needed.
#
# Authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret and no
# OTP. One-time setup, after the first manual publish:
#   npm package page → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: htynkn / Repository: agentdock
#   Workflow filename: release-pi-plugin.yml
# Requires npm CLI >= 11.5.1 (the job installs the latest 11.x) and Node >= 22.14.

on:
  push:
    tags:
      - "pi-plugin-v*"
  workflow_dispatch: # manual run publishes the version already in package.json

permissions:
  contents: read
  id-token: write # required for Trusted Publishing / provenance

concurrency:
  group: release-pi-plugin
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pi-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.com
          cache: npm
          cache-dependency-path: pi-plugin/package-lock.json

      - name: Update npm
        run: |
          npm install --global npm@11 || sudo npm install --global npm@11
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#pi-plugin-v}"
          if ! node -e '
            const semver = /^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/;
            process.exit(semver.test(process.argv[1]) ? 0 : 1);
          ' "$version"; then
            echo "::error::tag $GITHUB_REF_NAME does not carry a semver version"
            exit 1
          fi
          current="$(node -p 'require("./package.json").version')"
          if [ "$current" != "$version" ]; then
            echo "package.json has $current, tag says $version — publishing $version"
            npm version "$version" --no-git-tag-version --allow-same-version
          fi
          echo "releasing ${GITHUB_REF_NAME} as version $(node -p 'require("./package.json").version')"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check tarball contents
        run: npm run check:pack

      - name: Publish
        # --ignore-scripts: the checks above already ran; prepublishOnly would repeat them.
        # With Trusted Publishing npm attaches provenance automatically.
        # Prereleases (1.2.3-beta.1) go to the `next` dist-tag instead of `latest`.
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac
          echo "publishing $version with dist-tag $dist_tag"
          npm publish --ignore-scripts --provenance --access public --tag "$dist_tag"
