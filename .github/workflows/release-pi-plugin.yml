name: Release pi-plugin

# Publishes on tags like pi-plugin-v0.1.0: verify, test, then publish to public npm.
# Authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed:
#   npm package page → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: htynkn / Repository: agentdock
#   Workflow filename: release-pi-plugin.yml
# Requires npm CLI >= 11.5.1 (the job installs the latest 11.x) and Node >= 22.14.

on:
  push:
    tags:
      - "pi-plugin-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Trusted Publishing / provenance

concurrency:
  group: release-pi-plugin
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pi-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.com
          cache: npm
          cache-dependency-path: pi-plugin/package-lock.json

      - name: Update npm
        run: |
          npm install --global npm@11 || sudo npm install --global npm@11
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./package.json").version')"
          expected="pi-plugin-v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version, expected $expected"
            exit 1
          fi
          echo "publishing $expected"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check tarball contents
        run: npm run check:pack

      - name: Publish
        # With Trusted Publishing npm generates provenance automatically and
        # NODE_AUTH_TOKEN is not required.
        run: npm publish --provenance --access public
